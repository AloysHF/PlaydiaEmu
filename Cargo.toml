[workspace]
resolver = "2"
members = [
    "crates/playdiaemu-core",
    "crates/playdiaemu",
    "crates/playdiaemu-tools",
    "crates/playdiaemu-libretro",
]
default-members = ["crates/playdiaemu-libretro"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://example.invalid/playdiaemu"
authors = ["PlaydiaEmu contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
log = "0.4"
env_logger = "0.11"
minifb = "0.29"
rodio = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
gilrs = "=0.11.2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true

# Binaryen's Asyncify pass rejects the wasm exception-handling section that the
# prebuilt std ships with, so the Emscripten build compiles std from source
# with `-Zbuild-std` and needs panics to abort.
[profile.wasm-release]
inherits = "release"
panic = "abort"
