[workspace]
resolver = "2"
members = [
    "crates/playdiaemu-core",
    "crates/playdiaemu",
    "crates/playdiaemu-tools",
    "crates/playdiaemu-libretro",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/playdiaemu"
authors = ["PlaydiaEmu contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
log = "0.4"
env_logger = "0.11"
minifb = "0.28"
rodio = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
gilrs = "=0.11.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true
